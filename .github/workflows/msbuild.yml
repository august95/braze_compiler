name: MSBuild

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  BUILD_CONFIGURATION: Release
  PLATFORM: x64  # Ensure this matches your build platform

permissions:
  contents: read

