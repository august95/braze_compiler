  build-unit_test:
    runs-on: windows-latest
    needs: build-compiler_lib

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Restore NuGet packages
      run: nuget restore braze_compiler.sln

    - name: Build unit_test Project
      run: msbuild unit_test/unit_test.vcxproj /p:Configuration=${{ env.BUILD_CONFIGURATION }} /p:Platform=${{ env.PLATFORM }}

    - name: Run Unit Tests
      run: D:\a\braze_compiler\braze_compiler\unit_test\x64\Release\unit_test.exe

  make-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y build-essential && sudo apt-get install gcc && sudo apt-get install make && sudo apt-get install gcc-multilib && sudo apt-get install g++-multilib && sudo apt-get install nasm

    - name: Build with make
      run: make

    - name: Compile test file with Braze
      run: ./braze

    - name: Run file compiled by Braze
      run: ./test_file